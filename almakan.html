<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d"><title>Company Task Dashboard</title><link id="companyManifest" rel="manifest" href="/almakan.webmanifest"><link rel="apple-touch-icon" href="/icons/app-icon-192.png"><style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#23344c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#142e50,#245b8e);color:white;padding:24px 5%;text-align:center}header h1{margin:4px}header p{margin:5px;color:#dce6f2}.wrap{max-width:1200px;margin:auto;padding:20px}.bar,.card,.form{background:white;border:1px solid #dfe5ec;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 15px #18324d0a}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10}button{border:0;border-radius:9px;background:#285b91;color:white;padding:10px 14px;cursor:pointer;font-weight:600}button.alt{background:#edf2f8;color:#24466b}button.active{background:#6d4de1;color:white}button:disabled{opacity:.5}input,select,textarea{font:inherit;border:1px solid #cdd6e3;border-radius:8px;padding:10px;width:100%}textarea{min-height:90px}label{display:block;font-weight:600;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.muted{color:#65748b}.item{border-left:5px solid #5b69db}.item h3{margin:0 0 8px}.meta{font-size:12px;color:#64748b;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}#notice{padding:12px;border-radius:8px;margin-bottom:12px;background:#e7f6ed;color:#17683a}#notice.error{background:#fff0ef;color:#9a2924}@media(max-width:700px){.wrap{padding:10px}header{padding:18px 10px}.bar{position:static}}

header{background:linear-gradient(110deg,#312d67,#514a8b 65%,#167f88);box-shadow:0 7px 26px #342b6550}header h1{font-size:clamp(26px,3.3vw,42px)}.bar{border:1px solid #d5cdef;box-shadow:0 7px 20px #34347715}.card{border:1px solid #d9d5ed;background:linear-gradient(130deg,#fff,#f9f8ff);border-left:5px solid #6553d9}.card:hover{box-shadow:0 7px 22px #423b8b20}button{background:#5143a6;box-shadow:0 3px 0 #28245d}button.alt{background:#e9e7f6;color:#35316b;box-shadow:0 3px 0 #aaa5c8}button.active{background:#5640ad}#filterRow{position:static;padding:10px;gap:5px}#filterRow button{padding:6px 9px;font-size:12px}.card.overdue{border-left-color:#cf4d67;background:#fff0f2}.card.completed{border-left-color:#2d9d80;background:#eaf9f3}.card.upcoming{border-left-color:#3e83ca;background:#eff5ff}.card.pending{border-left-color:#d29a34;background:#fff8e9}.card.ongoing{border-left-color:#e78a46;background:#fff2e6}.card .actions{margin-top:12px}.checkrow{display:flex;gap:7px;align-items:center;margin-bottom:8px;font-size:12px}.checkrow input{width:auto}.status-select{max-width:155px;padding:7px}.updatebox{padding:10px 12px;background:#eae8fa;border-left:4px solid #6255c9;border-radius:9px;margin:7px 0}.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}.count{padding:15px;background:#fff;border-radius:12px;border:1px solid #d8d4ef}.count strong{font-size:24px;color:#3b3777}.compact-actions button{padding:6px 9px;font-size:11px}.form{scroll-margin-top:20px}

#form:not(.hidden){position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:88vh;overflow-y:auto;z-index:1000;box-shadow:0 25px 90px #17162b66;background:#fff;border:2px solid #d6cfff;padding:24px}#form h2{margin:0 0 10px}#form .actions{position:sticky;bottom:-24px;background:white;padding:12px 0}#form button{min-height:36px}.history-card{border-left-color:#b08bd8!important}.status-select{margin-left:6px}
</style></head><body><header><div style="font-size:12px;letter-spacing:2px">Company Task Management &amp; Monthly Reporting</div><h1 id="companyHeading">Company Dashboard</h1><p>Tasks · H.R. · General Tasks · Reminders · History</p></header><div class="wrap">
<div id="notice">Checking private company access…</div>
<div class="bar"><button data-tab="tasks" class="active">Tasks</button><button data-tab="hr" class="alt">H.R.</button><button data-tab="general" class="alt">General Tasks</button><button data-tab="reminders" class="alt">Reminders</button><button data-tab="history" class="alt">History</button><button id="addBtn">+ Add task</button><button id="refreshBtn" class="alt">Refresh</button><button id="installBtn" class="alt">Install Desktop App</button><input id="search" placeholder="Search this company's records" style="flex:1;min-width:170px"></div>
<div id="form" class="form hidden"><h2 id="formTitle">Add task</h2><label>Description<textarea id="description"></textarea></label><div class="grid"><label>Section<select id="section"><option value="General">General Tasks</option><option value="HR">H.R.</option></select></label><label>Status<select id="status"><option>Pending</option><option>Ongoing</option><option>Completed</option></select></label><label>Assigned to<input id="assigned"></label><label>Due date / reminder date<input id="due" type="datetime-local"></label></div><label>Notes / update<textarea id="notes"></textarea></label><div class="actions"><button id="saveBtn">Save</button><button id="cancelBtn" class="alt">Cancel</button></div></div>
<div id="filterRow" class="bar hidden"></div><div id="list"></div></div><script>
const API="https://nhitpdsarefrumjjqmtz.supabase.co/functions/v1/company-dashboard-api";
const companyKey=new URLSearchParams(location.search).get("company")||"almakan";const companyNames={sitech:"SiTech",almakan:"AlMakan Elevators & Escalators",restaurants:"Restaurants — Topaz, Kosheri & Jodah",tradewell:"TradeWell",shadows:"Shadows",ssomco:"SSOMCO","al-kawashif":"Al-Kawashif"};document.getElementById("companyHeading").textContent=companyNames[companyKey]||"Company Dashboard";document.title=(companyNames[companyKey]||"Company")+" | Company Dashboard";document.getElementById("companyManifest").href="/"+companyKey+".webmanifest";const providedToken=location.hash.slice(1).replace(/^access=/,"");const storageKey="company_private_access_"+companyKey;if(/^[a-f0-9]{64}$/.test(providedToken))localStorage.setItem(storageKey,providedToken);const token=providedToken||localStorage.getItem(storageKey)||"";
const el=id=>document.getElementById(id);let tab="tasks",items=[],editing=null,kind="tasks",deferredInstall=null,reminderFilter="all",taskFilter="all",selectedIds=new Set();
const notice=(msg,error=false)=>{el("notice").textContent=msg;el("notice").className=error?"error":""};
const req=async(section,body)=>{const r=await fetch(API+"?section="+section,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-company-token":token},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||"Request failed");return v};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(cls)n.className=cls;return n}
async function load(){if(!/^[a-f0-9]{64}$/.test(token)){notice("This private access link is incomplete. Ask your administrator for the full company link.",true);return;}kind=tab==="reminders"?"reminders":tab==="history"?"history":"tasks";try{notice("Loading company records…");const v=await req(kind);items=v.items||[];notice("Connected to the shared master database · "+items.length+" records loaded");render()}catch(e){notice(e.message,true);el("list").replaceChildren()}}
function reminderState(r){const p=r.payload||{};if(p.done||r.done)return "completed";if(["pending","ongoing","upcoming","overdue"].includes(p.statusOverride))return p.statusOverride;if(!p.at&&!r.reminder_at)return "pending";const d=new Date(p.at||r.reminder_at);if(!Number.isFinite(d.getTime()))return "pending";if(d.getTime()<Date.now())return "overdue";if(d.toDateString()===new Date().toDateString())return "ongoing";return "upcoming"}
function showFilters(){const f=el("filterRow");f.replaceChildren();if(kind==="history"){f.classList.remove("hidden");for(const [label,fn] of [["Select all",()=>{items.forEach(x=>selectedIds.add("history-"+x.id));render()}],["Deselect all",()=>{selectedIds.clear();render()}],["Download all PDF",()=>printHistory(false)],["Download selected PDF",()=>printHistory(true)]]){const b=node("button",label,"alt");b.onclick=fn;f.appendChild(b)}f.appendChild(node("small",selectedIds.size+" selected","muted"));return}if(kind==="tasks"){f.classList.remove("hidden");const statuses=["all","pending","ongoing","completed"];for(const st of statuses){const matching=items.filter(x=>st==="all"||String(x.payload?.status||x.status||"Pending").toLowerCase()===st);const b=node("button",st[0].toUpperCase()+st.slice(1)+" "+matching.length,taskFilter===st?"active":"alt");b.onclick=()=>{taskFilter=st;render()};f.appendChild(b)}return}if(kind!=="reminders"){f.classList.add("hidden");return}f.classList.remove("hidden");const statuses=["all","pending","ongoing","upcoming","overdue","completed"];for(const st of statuses){const b=node("button",st[0].toUpperCase()+st.slice(1)+" "+(st==="all"?items.length:items.filter(x=>reminderState(x)===st).length),st===reminderFilter?"active":"alt");b.onclick=()=>{reminderFilter=st;render()};f.appendChild(b)}const a=node("button","Select all","alt"),d=node("button","Deselect all","alt"),pdf=node("button","Download all PDF","alt"),sel=node("button","Download selected PDF","alt");a.onclick=()=>{items.filter(r=>reminderFilter==="all"||reminderState(r)===reminderFilter).forEach(r=>selectedIds.add(String(r.id)));render()};d.onclick=()=>{selectedIds.clear();render()};pdf.onclick=()=>printReminders(false);sel.onclick=()=>printReminders(true);for(const b of [a,d,pdf,sel])f.appendChild(b);f.appendChild(node("small",selectedIds.size+" selected","muted"))}
function printReminders(selected){const rows=items.filter(r=>(!selected||selectedIds.has(String(r.id)))&&(reminderFilter==="all"||reminderState(r)===reminderFilter));if(!rows.length){alert("No reminders selected");return}const w=window.open("","_blank");if(!w){alert("Please allow popups to download PDF");return}const escHtml=v=>String(v||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));w.document.write("<html><head><title>Company Reminders</title><style>body{font:14px Arial;padding:25px}article{padding:14px;border-bottom:1px solid #ccc}h2{color:#34306d}</style></head><body><h2>"+escHtml(companyNames[companyKey])+" — Reminders</h2>"+rows.map(r=>"<article><b>"+escHtml(r.payload?.title||r.title)+"</b><p>"+escHtml(r.payload?.text||"")+"</p><small>"+escHtml(r.payload?.at||r.reminder_at)+" · "+reminderState(r)+"</small></article>").join("")+"</body></html>");w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function printHistory(selected){const rows=items.filter(x=>!selected||selectedIds.has("history-"+x.id));if(!rows.length){alert("No history entries selected");return}const w=window.open("","_blank");if(!w){alert("Please allow popups");return}const escHtml=v=>String(v||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));w.document.write("<html><head><title>Company History</title><style>body{font:14px Arial;padding:25px}article{padding:12px;border-bottom:1px solid #ddd}</style></head><body><h2>"+escHtml(companyNames[companyKey])+" — Task History</h2>"+rows.map(r=>"<article><b>"+escHtml(r.task_name)+"</b><p>"+escHtml(r.details)+"</p><small>"+escHtml(r.action)+" · "+escHtml(r.changed_at)+"</small></article>").join("")+"</body></html>");w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function render(){showFilters();const root=el("list");root.replaceChildren();let rows=items;if(kind==="tasks"){if(tab==="hr")rows=rows.filter(r=>r.payload?.taskType==="HR");if(tab==="general")rows=rows.filter(r=>r.payload?.taskType!=="HR")}if(kind==="tasks"&&taskFilter!=="all")rows=rows.filter(r=>String(r.payload?.status||r.status||"Pending").toLowerCase()===taskFilter);if(kind==="reminders"&&reminderFilter!=="all")rows=rows.filter(r=>reminderState(r)===reminderFilter);const term=el("search").value.toLowerCase();rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(term));if(kind==="tasks"){const counts=node("div",undefined,"counts");for(const [name,fn] of [["Total",()=>items.length],["Completed",()=>items.filter(r=>String(r.payload?.status||r.status).toLowerCase()==="completed").length],["Ongoing",()=>items.filter(r=>String(r.payload?.status||r.status).toLowerCase()==="ongoing").length],["Pending",()=>items.filter(r=>String(r.payload?.status||r.status||"Pending").toLowerCase()==="pending").length]]){const tile=node("div",undefined,"count");tile.appendChild(node("strong",fn()));tile.appendChild(node("div",name,"muted"));counts.appendChild(tile)}root.appendChild(counts)}root.appendChild(node("p",rows.length+" matching "+(kind==="history"?"history entries":kind==="reminders"?"reminders":"tasks"),"muted"));for(const r of rows){const card=node("article",undefined,"card item"+(kind==="reminders"?" "+reminderState(r):kind==="history"?" history-card":""));const p=r.payload||{};if(kind==="history"){const check=node("label",undefined,"checkrow");const c=node("input");c.type="checkbox";c.checked=selectedIds.has("history-"+r.id);c.onchange=()=>{if(c.checked)selectedIds.add("history-"+r.id);else selectedIds.delete("history-"+r.id);showFilters()};check.appendChild(c);check.appendChild(node("span","Select for PDF"));card.appendChild(check)}if(kind==="reminders"){const check=node("label",undefined,"checkrow");const c=node("input");c.type="checkbox";c.checked=selectedIds.has(String(r.id));c.onchange=()=>{if(c.checked)selectedIds.add(String(r.id));else selectedIds.delete(String(r.id));showFilters()};check.appendChild(c);check.appendChild(node("span","Select for PDF"));card.appendChild(check)}card.appendChild(node("h3",kind==="history"?(r.task_name||"Task change"):kind==="reminders"?(p.title||r.title):(p.task||r.task)));card.appendChild(node("div",kind==="history"?(r.action||"")+" · "+(r.changed_at||""):kind==="reminders"?(p.at||r.reminder_at||""):(p.status||r.status||"Pending")+" · "+(p.assigned||"Unassigned")+" · "+(p.taskType==="HR"?"H.R.":"General Tasks"),"meta"));const details=kind==="history"?(r.details||""):kind==="reminders"?(p.text||""):(p.notes||"");if(details)card.appendChild(node("p",details));if(Array.isArray(p.updates)&&p.updates.length){const updates=node("div");updates.appendChild(node("b","Updates"));for(const u of p.updates.slice(-5).reverse()){updates.appendChild(node("p",(u.date||u.at||"")+" · "+(u.text||""),"updatebox"))}card.appendChild(updates)}if(kind!=="history"){const actions=node("div",undefined,"actions");const edit=node("button","Edit / Add Update","alt");edit.onclick=()=>editRow(r);actions.appendChild(edit);if(kind==="tasks"){const status=node("select",undefined,"status-select");for(const st of ["Pending","Ongoing","Completed"]){const opt=node("option",st);opt.value=st;opt.selected=String(p.status||r.status||"Pending").toLowerCase()===st.toLowerCase();status.appendChild(opt)}status.onchange=async()=>{try{await req("tasks",{action:"update",id:r.id,payload:{...p,status:status.value}});await load()}catch(e){notice(e.message,true)}};actions.appendChild(status)}if(kind==="reminders"){const status=node("select",undefined,"status-select");for(const st of ["pending","ongoing","upcoming","overdue","completed"]){const opt=node("option",st[0].toUpperCase()+st.slice(1));opt.value=st;opt.selected=reminderState(r)===st;status.appendChild(opt)}status.onchange=async()=>{const v=status.value;const payload={...(r.payload||{}),done:v==="completed",statusOverride:v==="completed"?null:v};try{await req("reminders",{action:"update",id:r.id,payload});await load()}catch(e){notice(e.message,true)}};actions.appendChild(status)}card.appendChild(actions)}root.appendChild(card)}}
function editRow(r){editing=r;el("form").classList.remove("hidden");el("formTitle").textContent=r?"Edit / Update":"Add "+(kind==="reminders"?"reminder":"task");const p=r?.payload||{};el("description").value=kind==="reminders"?(p.title||r?.title||""):(p.task||r?.task||"");el("section").value=p.taskType==="HR"?"HR":"General";el("status").value=p.status||r?.status||"Pending";el("assigned").value=p.assigned||"";el("due").value=(kind==="reminders"?p.at:p.date||"").slice(0,16);el("notes").value="";el("description").focus()}
async function save(){const title=el("description").value.trim();if(!title){notice("Enter a description first.",true);return}const p={...(editing?.payload||{})};if(kind==="reminders"){p.title=title;p.at=el("due").value;p.text=editing?.payload?.text||""}else{p.task=title;p.taskType=el("section").value;p.status=el("status").value;p.assigned=el("assigned").value;p.date=el("due").value.slice(0,10)}const note=el("notes").value.trim();if(note){p.updates=[...(p.updates||[]),{date:new Date().toLocaleString(),text:note}]}try{await req(kind,{action:editing?"update":"create",id:editing?.id,payload:p});el("form").classList.add("hidden");editing=null;await load();notice("Saved successfully. Your master dashboard will show this update when refreshed.")}catch(e){notice(e.message,true)}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>{x.className=x===b?"active":"alt"});el("form").classList.add("hidden");el("addBtn").style.display=tab==="history"?"none":"inline-block";el("addBtn").textContent=tab==="reminders"?"+ Add reminder":"+ Add task";load()});
el("addBtn").onclick=()=>{if(tab==="history")return;kind=tab==="reminders"?"reminders":"tasks";editRow(null);el("section").value=tab==="hr"?"HR":"General"};
el("refreshBtn").onclick=load;el("search").oninput=render;el("saveBtn").onclick=save;el("cancelBtn").onclick=()=>el("form").classList.add("hidden");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
el("installBtn").onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice}else alert("In Microsoft Edge: menu → Apps → Install this site as an app. In Chrome: menu → Cast, save and share → Install page as app. This private dashboard will keep your saved access on this device.")};
load();
</script></body></html>
